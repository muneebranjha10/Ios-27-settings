name: Build experimental APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -x "$SDK/build-tools/35.0.0/aapt2" ]; then
            MANAGER="$(command -v sdkmanager || true)"
            if [ -z "$MANAGER" ]; then
              MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            fi
            test -n "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
      - name: Generate original reference icon masks
        run: |
          npm pack ionicons@8.1.0 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/icon-source"
          tar -xzf "$RUNNER_TEMP/ionicons-8.1.0.tgz" -C "$RUNNER_TEMP/icon-source"
          python3 -m venv "$RUNNER_TEMP/icon-venv"
          "$RUNNER_TEMP/icon-venv/bin/pip" install cairosvg==2.7.1
          "$RUNNER_TEMP/icon-venv/bin/python" scripts/generate_icons.py "$RUNNER_TEMP/icon-source/package"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: iSettings27-experimental-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
