name: Build experimental APK
on:
  push:
    branches: [main, upstream-glass]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use runner Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          if [ -z "$MANAGER" ]; then MANAGER="$(command -v sdkmanager)"; fi
          test -n "$MANAGER"
          "$MANAGER" --sdk_root="$SDK" --channel=3 --list > "$RUNNER_TEMP/sdk-list.txt"
          grep -E 'platforms;android-37(\.0)?[[:space:]]*\||build-tools;37\.' "$RUNNER_TEMP/sdk-list.txt" || true
          PLATFORM="$(awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); if ($1=="platforms;android-37.0" || $1=="platforms;android-37") print $1}' "$RUNNER_TEMP/sdk-list.txt" | sort -u | tail -1)"
          test -n "$PLATFORM"
          "$MANAGER" --sdk_root="$SDK" --channel=3 "$PLATFORM" 'build-tools;37.0.0'
          test -x "$SDK/build-tools/37.0.0/aapt2"
      - name: Generate original reference icon masks
        run: |
          npm pack ionicons@8.1.0 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/icon-source"
          tar -xzf "$RUNNER_TEMP/ionicons-8.1.0.tgz" -C "$RUNNER_TEMP/icon-source"
          python3 -m venv "$RUNNER_TEMP/icon-venv"
          "$RUNNER_TEMP/icon-venv/bin/pip" install cairosvg==2.7.1
          "$RUNNER_TEMP/icon-venv/bin/python" scripts/generate_icons.py "$RUNNER_TEMP/icon-source/package"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: iSettings27-experimental-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
