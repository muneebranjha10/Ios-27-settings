plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
 namespace 'dev.isettings.theme'
 compileSdk 37
 buildToolsVersion '37.0.0'
 defaultConfig { applicationId 'dev.isettings.theme'; minSdk 31; targetSdk 32; versionCode 13; versionName '0.13-native-research' }
 buildFeatures { compose true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { resources { excludes += ['DebugProbesKt.bin','kotlin-tooling-metadata.json','META-INF/*.version','META-INF/**/LICENSE.txt'] } }
}
dependencies {
 implementation project(':nativeglass')
 compileOnly 'de.robv.android.xposed:api:82'
 implementation 'io.github.kyant0:backdrop:2.0.1'
 implementation 'io.github.kyant0:shapes:1.2.1'
 implementation 'org.jetbrains.compose.foundation:foundation:1.12.0'
 implementation 'org.jetbrains.compose.ui:ui:1.12.0'
 implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'
 implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
 implementation 'androidx.savedstate:savedstate:1.3.3'
}
